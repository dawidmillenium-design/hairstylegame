name: Arcade UX checks
on:
  pull_request:
  push:
    branches:
      - feature/pixel-call-paused-cutscenes-10-lives

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check React and TypeScript
        run: npx tsc --noEmit
      - name: Build optimized production assets
        run: npm run build
